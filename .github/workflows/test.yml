name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install lint tools
      run: pip install flake8
    - name: Lint
      run: flake8 src/ --max-line-length=100 --count

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install ".[test]"
    - name: Test
      if: matrix.python-version != '3.11'
      run: pytest tests/ -v --tb=short
    - name: Portable Episode contract without SDK extras
      run: pytest tests/test_portability_contract.py -q
    - name: Test with coverage
      if: matrix.python-version == '3.11'
      run: >
        pytest tests/ -v --tb=short
        --cov=eval_engine
        --cov-report=term-missing
        --cov-fail-under=50

  business-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install evaluation engine
      run: pip install ".[test]"
    - name: Install portfolio dependencies
      run: |
        git clone --depth=1 https://github.com/weihuaguo270-ops/react-agent.git /tmp/react-agent
        git clone --depth=1 https://github.com/weihuaguo270-ops/trace-debugger.git /tmp/trace-debugger
        pip install -e /tmp/react-agent -e /tmp/trace-debugger
    - name: Run expense release gate
      env:
        PORTFOLIO_WORKSPACE: /tmp
      run: |
        python examples/run_expense_release_pipeline.py \
          --out /tmp/expense-release \
          --performance examples/fixtures/performance_pass.json
    - name: Upload release evidence
      uses: actions/upload-artifact@v4
      with:
        name: expense-release-evidence
        path: /tmp/expense-release

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install ".[test]"
    - name: Pytest (no PYTHONIOENCODING)
      shell: powershell
      run: |
        Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
        python -m pytest tests/ -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install
      run: pip install ".[test,dev]"
    - name: mypy
      run: mypy src/eval_engine

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install package + audit
      run: |
        python -m venv .audit-venv
        .audit-venv/bin/python -m pip install -U pip "setuptools>=83"
        .audit-venv/bin/python -m pip install ".[judge,test,dev]"
        .audit-venv/bin/pip-audit --progress-spinner off
